[package]
name = "kage-cli"
description = "A fast, hackable coding agent for your terminal, editor and browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kage"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
compak = { workspace = true, features = ["tar", "xz"] }
dirs.workspace = true
ignore.workspace = true
kage-acp.workspace = true
kage-core.workspace = true
kage-jsonrpc.workspace = true
kage-kura.workspace = true
kage-loop.workspace = true
kage-mcp.workspace = true
kage-plugin.workspace = true
kage-provider.workspace = true
kage-remote.workspace = true
kage-session.workspace = true
kage-tools.workspace = true
kage-tui.workspace = true
mimalloc.workspace = true
rpassword.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
toml.workspace = true
ureq.workspace = true
url.workspace = true
ulid.workspace = true
thiserror.workspace = true

[target."cfg(unix)".dependencies]
nix.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
kage-provider = { workspace = true, features = ["testing"] }
kage-tools.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tungstenite.workspace = true
