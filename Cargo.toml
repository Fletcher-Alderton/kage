[workspace]
resolver = "3"
members = [
  "crates/kage-acp",
  "crates/kage-acp-wire",
  "crates/kage-cli",
  "crates/kage-client",
  "crates/kage-core",
  "crates/kage-desktop",
  "crates/kage-jsonrpc",
  "crates/kage-kura",
  "crates/kage-loop",
  "crates/kage-mcp",
  "crates/kage-plugin",
  "crates/kage-provider",
  "crates/kage-remote",
  "crates/kage-session",
  "crates/kage-tools",
  "crates/kage-tui",
  "xtask",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
readme = "README.md"
homepage = "https://github.com/QaidVoid/kage"
repository = "https://github.com/QaidVoid/kage"
license = "MIT"
keywords = ["agent", "ai", "llm", "lua", "tui"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
kage-acp = { path = "crates/kage-acp", version = "0.5.0" }
kage-acp-wire = { path = "crates/kage-acp-wire", version = "0.5.0" }
kage-client = { path = "crates/kage-client", version = "0.5.0" }
kage-core = { path = "crates/kage-core", version = "0.5.0" }
kage-jsonrpc = { path = "crates/kage-jsonrpc", version = "0.5.0" }
kage-kura = { path = "crates/kage-kura", version = "0.5.0" }
kage-loop = { path = "crates/kage-loop", version = "0.5.0" }
kage-mcp = { path = "crates/kage-mcp", version = "0.5.0" }
kage-plugin = { path = "crates/kage-plugin", version = "0.5.0" }
kage-provider = { path = "crates/kage-provider", version = "0.5.0" }
kage-remote = { path = "crates/kage-remote", version = "0.5.0" }
kage-session = { path = "crates/kage-session", version = "0.5.0" }
kage-tools = { path = "crates/kage-tools", version = "0.5.0" }
kage-tui = { path = "crates/kage-tui", version = "0.5.0" }

aes-gcm = "0.11.1"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
compak = { version = "0.2.2", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = [
  "default-fancy"
] }

chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
getrandom = "0.4.3"
globset = "0.4.20"
grep = "0.4.1"
html2text = "0.17.1"
ignore = "0.4.33"
libc = "0.2.189"
mimalloc = "0.1.52"
mlua = { version = "0.12.1", features = ["lua54", "send", "vendored", "async"] }
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "socket", "user"] }
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
  "simd"
] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rpassword = "7.5.4"
schemars = "1.2.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
signal-hook = "0.4.4"
similar = "3.2.0"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ulid = { version = "3.0.0", features = ["serde"] }
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "allow"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# Size and speed for shipped binaries, after soar's profile. Panics keep
# unwinding because the plugin host catches a panicking Lua job and keeps
# its thread alive.
[profile.release]
codegen-units = 1
lto = true
strip = true

# Unoptimized egui, epaint and syntect miss a 120 Hz frame budget on a
# long kage-desktop transcript, so a debug run animated in visible
# steps. These build optimized once; everything else stays quick to
# rebuild.
[profile.dev.package.egui]
opt-level = 2

[profile.dev.package.epaint]
opt-level = 2

[profile.dev.package.emath]
opt-level = 2

[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2
