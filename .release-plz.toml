# release-plz: opens a release PR with the version bump and changelog
# on every push to main, and publishes to crates.io and tags the
# release once that PR merges. Every crate shares the workspace
# version, so they release together; only kage-cli, which installs
# the `kage` binary, gets a tag, a GitHub release and the changelog.
# The desktop and web client ship on that same release.

[workspace]
allow_dirty = false
changelog_update = false
dependencies_update = false
git_release_enable = false
git_tag_enable = false
pr_labels = ["release"]
publish_allow_dirty = false
semver_check = false
# A push whose push event never started this workflow (or a direct
# version bump on main) still releases, instead of silently skipping.
release_always = true
# GitHub refuses release notes over 125,000 characters, as the first
# release's full history was, so a longer changelog links the file.
git_release_body = """
{% if changelog | length > 100000 -%}
The changes are too many to list here; see
[CHANGELOG.md](https://github.com/QaidVoid/kage/blob/v{{ version }}/CHANGELOG.md).
{%- else -%}
{{ changelog }}
{%- endif %}
{% if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
* @{{ contributor.username }}
{% endfor %}
{% endif %}
"""

[[package]]
name = "kage-cli"
version_group = "kage"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
  "kage-acp",
  "kage-acp-wire",
  "kage-client",
  "kage-core",
  "kage-desktop",
  "kage-jsonrpc",
  "kage-kura",
  "kage-loop",
  "kage-mcp",
  "kage-plugin",
  "kage-provider",
  "kage-remote",
  "kage-session",
  "kage-tools",
  "kage-tui",
]
git_tag_name = "v{{ version }}"
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"

[[package]]
name = "kage-acp"
version_group = "kage"

[[package]]
name = "kage-acp-wire"
version_group = "kage"

[[package]]
name = "kage-core"
version_group = "kage"

[[package]]
name = "kage-jsonrpc"
version_group = "kage"

[[package]]
name = "kage-kura"
version_group = "kage"

[[package]]
name = "kage-loop"
version_group = "kage"

[[package]]
name = "kage-mcp"
version_group = "kage"

[[package]]
name = "kage-plugin"
version_group = "kage"

[[package]]
name = "kage-provider"
version_group = "kage"

[[package]]
name = "kage-remote"
version_group = "kage"

[[package]]
name = "kage-session"
version_group = "kage"

[[package]]
name = "kage-tools"
version_group = "kage"

[[package]]
name = "kage-tui"
version_group = "kage"

[[package]]
name = "kage-client"
version_group = "kage"

[[package]]
name = "kage-desktop"
version_group = "kage"
# Never created, as tagging is off. The default name would match the
# `kage-desktop-v*` tags of the old separate desktop releases, which
# release-plz then mistakes for releases of this crate.
git_tag_name = "kage-desktop-crate-v{{ version }}"

[[package]]
name = "xtask"
publish = false
release = false

[changelog]
header = """
# Changelog
"""
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.link }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ release_link }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""
trim = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor\\(clippy\\)", skip = true },
  { message = "^refactor", group = "<!-- 2 -->Refactor" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 7 -->Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 9 -->Revert" },
]
